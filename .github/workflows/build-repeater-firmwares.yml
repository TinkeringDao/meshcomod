# Repeater TCP binaries are normally built locally and committed under prebuilt/
# (see docs/REPEATER_RELEASE_PROCEDURE.md). This workflow does not run on tag push.
# Run manually from Actions only if you need CI-built artifacts.

name: Build Repeater Firmwares

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      repeater_version:
        description: 'Same as REPEATER_FIRMWARE_VERSION, e.g. v1.14.1.0-repeater-tcp (or legacy repeater-1.0.2)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          REPEATER_FIRMWARE_VERSION: ${{ inputs.repeater_version }}
          DISABLE_DEBUG: '1'
        run: |
          set -euo pipefail
          if [[ ! "$REPEATER_FIRMWARE_VERSION" =~ ^[a-zA-Z0-9._-]+$ ]]; then
            echo "ERROR: Invalid repeater_version format: '$REPEATER_FIRMWARE_VERSION'" >&2
            exit 1
          fi
          /usr/bin/env bash build.sh build-repeater-firmwares

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repeater-firmwares
          path: out
