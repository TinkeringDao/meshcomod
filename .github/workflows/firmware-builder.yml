name: Firmware Builder

on:
  workflow_call:
    inputs:
      firmware_type:
        required: true
        type: string
      release_title_prefix:
        required: true
        type: string

permissions: {}

jobs:
  generate-build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.get-build-targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get Build Targets
        id: get-build-targets
        env:
          FIRMWARE_TYPE: ${{ inputs.firmware_type }}
        run: |
          set -euo pipefail
          if [[ ! "$FIRMWARE_TYPE" =~ ^[a-z0-9-]+$ ]]; then
            echo "ERROR: Invalid firmware_type: '$FIRMWARE_TYPE'" >&2
            exit 1
          fi
          TARGET_LIST="$(/usr/bin/env bash build.sh "get-${FIRMWARE_TYPE}-firmwares-to-build")"
          JSON_ARRAY="$(printf '%s\n' "$TARGET_LIST" | jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "targets=$JSON_ARRAY" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    continue-on-error: true
    strategy:
      matrix:
        target: ${{ fromJson(needs.generate-build-matrix.outputs.targets) }}
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        id: setup
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmware
        env:
          FIRMWARE_VERSION: ${{ steps.setup.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ ! "$BUILD_TARGET" =~ ^[a-zA-Z0-9_.-]+$ ]]; then
            echo "ERROR: Invalid matrix target: '$BUILD_TARGET'" >&2
            exit 1
          fi
          /usr/bin/env bash build.sh build-firmware "$BUILD_TARGET"

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: "${{ matrix.target }}"
          path: out

  create-release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        id: setup
        uses: ./.github/actions/setup-build-environment

      - name: Download All Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: "${{ inputs.release_title_prefix }} ${{ steps.setup.outputs.version }}"
          body: ""
          draft: true
          files: out/*
