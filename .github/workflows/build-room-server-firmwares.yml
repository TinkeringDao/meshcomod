name: Build Room Server Firmwares

on:
  workflow_dispatch:
  push:
    tags:
      - 'room-server-*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Build Environment
        id: setup
        uses: ./.github/actions/setup-build-environment

      - name: Build Firmwares
        env:
          FIRMWARE_VERSION: ${{ steps.setup.outputs.version }}
        run: /usr/bin/env bash build.sh build-room-server-firmwares

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: room-server-firmwares
          path: out

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Room Server Firmware ${{ steps.setup.outputs.version }}
          body: ""
          draft: false
          generate_release_notes: true
          files: out/*

      - name: Prune old releases (keep last 5)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: /usr/bin/env bash scripts/ci/prune-releases.sh "room-server-" 5
